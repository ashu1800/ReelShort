server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # M8: 安全响应头（TLS 由宿主机 Nginx/Cloudflare 终结，此处补充安全头）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # W6a: CSP 基线为 default-src 'self'，按后台实际资源收敛：
    #   - style-src 需 'unsafe-inline'：Element Plus 运行时注入内联样式，Vue 也使用 style 属性绑定；
    #   - img-src 需 data:：Element Plus 内置 PNG/SVG 占位图以内联 data: URI 形式打包；
    #   - script-src 不含 'unsafe-eval'：vue-tsc/vite 生产产物中不存在 eval 或 new Function；
    #   - 构建产物无外链脚本/样式/字体（无 Google Fonts、无 @font-face），故 font-src 只需 'self'；
    #   - connect-src 只需 'self'：Axios 默认走同源 /api/admin（VITE_API_BASE_URL 未在部署配置中覆盖）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /downloads/android {
        return 404;
    }

    location ^~ /downloads/android/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M8: actuator 不应经 nginx 对外暴露，仅容器内部健康检查使用（127.0.0.1:8080）

    # W6a: SPA 入口禁止缓存，避免重新部署后仍引用已删除的 hash 资源导致白屏
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # W6a: 带内容 hash 的构建产物可长期缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
