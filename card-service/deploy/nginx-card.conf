# card.hjj888.cc —— 卡密服务入口（管理后台 + 公共卡密 API）
#
# 安装位置：/etc/nginx/sites-available/card  →  ln -s 到 sites-enabled/card
# 注意：443 的 server 块与证书由 certbot --nginx 自动补齐，本文件只提供 80 端口块。
# 不影响同机已有的 shortlink.hjj888.cc vhost。

server {
    server_name card.hjj888.cc;

    client_max_body_size 2m;

    # ---- Cloudflare 真实客户端 IP ----
    # 只有当直连对端属于下面这些网段时，nginx 才会采信 CF-Connecting-IP；
    # 因此绕过 Cloudflare 直连源站并伪造该头部的请求不会被误判为可信 IP。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    include snippets/cardservice-headers.conf;

    # Let's Encrypt HTTP-01 校验（Cloudflare 代理会把这一个路径透传到源站）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端可能伪造的 XFF，保证后端限流与日志拿到真实 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}
