services:
  postgres:
    image: postgres:17
    container_name: reelshort-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reelshort}
      POSTGRES_USER: ${POSTGRES_USER:-reelshort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reelshort} -d ${POSTGRES_DB:-reelshort}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8
    container_name: reelshort-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  content-provider:
    build:
      context: ../content-provider
    container_name: reelshort-content-provider
    restart: unless-stopped
    environment:
      CONTENT_PROVIDER_HOST: 0.0.0.0
      CONTENT_PROVIDER_PORT: 5000
      # 内容源内部共享密钥，必须与 backend 服务使用同一取值。
      CONTENT_PROVIDER_INTERNAL_TOKEN: ${CONTENT_PROVIDER_INTERNAL_TOKEN:-}
      # 内容源抓取的是上游 ReelShort 站点，与"本平台公网域名" REELSHORT_SITE_URL 语义不同；
      # 传错会让内容源去抓自己（拿不到 Next.js buildId，全站内容 502）。
      REELSHORT_UPSTREAM_SITE_URL: ${REELSHORT_UPSTREAM_SITE_URL:-https://www.reelshort.com}
      REELSHORT_SITE_ID: ${REELSHORT_SITE_ID:-37}
      REELSHORT_REQUEST_TIMEOUT_SECONDS: ${REELSHORT_REQUEST_TIMEOUT_SECONDS:-10}
      REELSHORT_MAX_RESPONSE_BYTES: ${REELSHORT_MAX_RESPONSE_BYTES:-5242880}
      REELSHORT_MAX_REDIRECTS: ${REELSHORT_MAX_REDIRECTS:-3}
      REELSHORT_NEXT_BUILD_ID: ${REELSHORT_NEXT_BUILD_ID:-}
      REELSHORT_CATALOG_SEARCH_KEYWORDS: ${REELSHORT_CATALOG_SEARCH_KEYWORDS:-}
      REELSHORT_CATALOG_SEARCH_KEYWORDS_EN: ${REELSHORT_CATALOG_SEARCH_KEYWORDS_EN:-}
      REELSHORT_CATALOG_MAX_PAGES_PER_KEYWORD: ${REELSHORT_CATALOG_MAX_PAGES_PER_KEYWORD:-3}
      REELSHORT_CATALOG_MAX_BOOKS: ${REELSHORT_CATALOG_MAX_BOOKS:-500}
      REELSHORT_CATALOG_REQUEST_WORKERS: ${REELSHORT_CATALOG_REQUEST_WORKERS:-8}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../backend
    container_name: reelshort-backend
    restart: unless-stopped
    environment:
      REELSHORT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reelshort}
      REELSHORT_DB_USERNAME: ${POSTGRES_USER:-reelshort}
      REELSHORT_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REELSHORT_JPA_DDL_AUTO: ${REELSHORT_JPA_DDL_AUTO:-validate}
      REELSHORT_FLYWAY_ENABLED: ${REELSHORT_FLYWAY_ENABLED:-true}
      REELSHORT_ADMIN_USERNAME: ${REELSHORT_ADMIN_USERNAME:-admin}
      REELSHORT_ADMIN_PASSWORD_HASH: ${REELSHORT_ADMIN_PASSWORD_HASH:-}
      REELSHORT_CONTENT_PROVIDER_BASE_URL: http://content-provider:5000
      # 内容源内部共享密钥，必须与 content-provider 服务使用同一取值。
      CONTENT_PROVIDER_INTERNAL_TOKEN: ${CONTENT_PROVIDER_INTERNAL_TOKEN:-}
      REELSHORT_CONTENT_REFRESH_ENABLED: ${REELSHORT_CONTENT_REFRESH_ENABLED:-true}
      REELSHORT_CONTENT_REFRESH_INITIAL_DELAY: ${REELSHORT_CONTENT_REFRESH_INITIAL_DELAY:-5m}
      REELSHORT_CONTENT_REFRESH_INTERVAL: ${REELSHORT_CONTENT_REFRESH_INTERVAL:-6h}
      REELSHORT_CONTENT_REFRESH_SHELVES: ${REELSHORT_CONTENT_REFRESH_SHELVES:-recommend}
      # 内容源当前仅支持 en，多语言取值会导致同一货架被重复刷新。
      REELSHORT_CONTENT_REFRESH_LOCALES: ${REELSHORT_CONTENT_REFRESH_LOCALES:-en}
      REELSHORT_CONTENT_VIDEO_FALLBACK_TTL: ${REELSHORT_CONTENT_VIDEO_FALLBACK_TTL:-10m}
      REELSHORT_INTERNAL_SUPER_TOKEN: ${REELSHORT_INTERNAL_SUPER_TOKEN:-}
      REELSHORT_PAYMENT_CALLBACK_SECRET: ${REELSHORT_PAYMENT_CALLBACK_SECRET:?REELSHORT_PAYMENT_CALLBACK_SECRET must be set}
      REELSHORT_RATE_LIMIT_STORE: ${REELSHORT_RATE_LIMIT_STORE:-redis}
      # 限流可信代理白名单（逗号分隔，支持精确 IP 与 CIDR）。容器内 remoteAddr 是 Docker
      # 网关地址，未配置时后端会忽略 X-Forwarded-For，全部匿名客户端塌缩为同一个限流键。
      REELSHORT_TRUSTED_PROXIES: ${REELSHORT_TRUSTED_PROXIES:?REELSHORT_TRUSTED_PROXIES must be set to the Docker subnet, for example 172.18.0.0/16}
      # 自动打款执行能力开关，默认关闭；重新启用签名/广播前必须显式改为 true。
      REELSHORT_WITHDRAWAL_PAYOUT_ENABLED: ${REELSHORT_WITHDRAWAL_PAYOUT_ENABLED:-false}
      REELSHORT_REDIS_HOST: redis
      REELSHORT_REDIS_PORT: 6379
      REELSHORT_COS_SECRET_ID: ${REELSHORT_COS_SECRET_ID:-}
      REELSHORT_COS_SECRET_KEY: ${REELSHORT_COS_SECRET_KEY:-}
      REELSHORT_COS_REGION: ${REELSHORT_COS_REGION:-ap-chengdu}
      REELSHORT_COS_BUCKET: ${REELSHORT_COS_BUCKET:-}
      REELSHORT_RELEASE_PRESIGN_TTL: ${REELSHORT_RELEASE_PRESIGN_TTL:-1h}
      REELSHORT_TRON_HOT_WALLET_ADDRESS: ${REELSHORT_TRON_HOT_WALLET_ADDRESS:-}
      REELSHORT_TRON_API_KEY: ${REELSHORT_TRON_API_KEY:-}
      REELSHORT_TRON_INCOMING_TRANSFER_MAX_PAGES: ${REELSHORT_TRON_INCOMING_TRANSFER_MAX_PAGES:-50}
      REELSHORT_TRON_REQUEST_INTERVAL: ${REELSHORT_TRON_REQUEST_INTERVAL:-250ms}
      REELSHORT_TRON_RATE_LIMIT_RETRIES: ${REELSHORT_TRON_RATE_LIMIT_RETRIES:-3}
      REELSHORT_TRON_RETRY_INITIAL_DELAY: ${REELSHORT_TRON_RETRY_INITIAL_DELAY:-1s}
      REELSHORT_TRON_CHAIN_PARAMETER_CACHE_TTL: ${REELSHORT_TRON_CHAIN_PARAMETER_CACHE_TTL:-5m}
      REELSHORT_VIP_CONFIRMATION_GRACE: ${REELSHORT_VIP_CONFIRMATION_GRACE:-10m}
      REELSHORT_ETH_HOT_WALLET_ADDRESS: ${REELSHORT_ETH_HOT_WALLET_ADDRESS:-}
      REELSHORT_BSC_HOT_WALLET_ADDRESS: ${REELSHORT_BSC_HOT_WALLET_ADDRESS:-}
      # 连接池与日志：默认值在 application.properties，生产可通过 .env 覆盖
      REELSHORT_DB_POOL_MAXIMUM_SIZE: ${REELSHORT_DB_POOL_MAXIMUM_SIZE:-30}
      REELSHORT_LOG_FILE: ${REELSHORT_LOG_FILE:-logs/backend.log}
      REELSHORT_SYSTEM_LOG_ROOT: ${REELSHORT_SYSTEM_LOG_ROOT:-logs}
      REELSHORT_SYSTEM_LOG_MAX_LINES: ${REELSHORT_SYSTEM_LOG_MAX_LINES:-500}
      REELSHORT_SYSTEM_LOG_MAX_BYTES: ${REELSHORT_SYSTEM_LOG_MAX_BYTES:-1048576}
      # 凭证爆破锁定（钱包改绑 / 改密共用）
      REELSHORT_CREDENTIAL_GUARD_MAX_FAILURES: ${REELSHORT_CREDENTIAL_GUARD_MAX_FAILURES:-5}
      REELSHORT_CREDENTIAL_GUARD_LOCK_DURATION: ${REELSHORT_CREDENTIAL_GUARD_LOCK_DURATION:-15m}
      # 关键限流阈值（完整规则表见 application.properties 的 reelshort.rate-limit.rules[*]）
      REELSHORT_RATE_LIMIT_APP_CAPTCHA_LIMIT: ${REELSHORT_RATE_LIMIT_APP_CAPTCHA_LIMIT:-10}
      REELSHORT_RATE_LIMIT_APP_CAPTCHA_WINDOW: ${REELSHORT_RATE_LIMIT_APP_CAPTCHA_WINDOW:-1m}
      REELSHORT_RATE_LIMIT_APP_WALLET_LIMIT: ${REELSHORT_RATE_LIMIT_APP_WALLET_LIMIT:-10}
      REELSHORT_RATE_LIMIT_APP_WALLET_WINDOW: ${REELSHORT_RATE_LIMIT_APP_WALLET_WINDOW:-1m}
      REELSHORT_RATE_LIMIT_APP_WALLET_BIND_LIMIT: ${REELSHORT_RATE_LIMIT_APP_WALLET_BIND_LIMIT:-10}
      REELSHORT_RATE_LIMIT_APP_WALLET_BIND_WINDOW: ${REELSHORT_RATE_LIMIT_APP_WALLET_BIND_WINDOW:-1m}
      REELSHORT_RATE_LIMIT_APP_WITHDRAWAL_LIMIT: ${REELSHORT_RATE_LIMIT_APP_WITHDRAWAL_LIMIT:-5}
      REELSHORT_RATE_LIMIT_APP_WITHDRAWAL_WINDOW: ${REELSHORT_RATE_LIMIT_APP_WITHDRAWAL_WINDOW:-1m}
      REELSHORT_RATE_LIMIT_APP_SOCIAL_LIMIT: ${REELSHORT_RATE_LIMIT_APP_SOCIAL_LIMIT:-30}
      REELSHORT_RATE_LIMIT_APP_SOCIAL_WINDOW: ${REELSHORT_RATE_LIMIT_APP_SOCIAL_WINDOW:-1m}
      # 链上节点与合约：默认值在 application.properties，换节点/换网络时必须能通过 .env 覆盖
      REELSHORT_TRON_NODE_URL: ${REELSHORT_TRON_NODE_URL:-https://api.trongrid.io}
      REELSHORT_TRON_USDT_CONTRACT: ${REELSHORT_TRON_USDT_CONTRACT:-TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t}
      REELSHORT_TRON_REQUIRED_CONFIRMATIONS: ${REELSHORT_TRON_REQUIRED_CONFIRMATIONS:-20}
      REELSHORT_ETH_NODE_URL: ${REELSHORT_ETH_NODE_URL:-https://mainnet.infura.io/v3/}
      REELSHORT_ETH_API_KEY: ${REELSHORT_ETH_API_KEY:-}
      REELSHORT_ETH_USDT_CONTRACT: ${REELSHORT_ETH_USDT_CONTRACT:-0xdAC17F958D2ee523a2206206994597C13D831ec7}
      REELSHORT_ETH_CHAIN_ID: ${REELSHORT_ETH_CHAIN_ID:-1}
      REELSHORT_ETH_REQUIRED_CONFIRMATIONS: ${REELSHORT_ETH_REQUIRED_CONFIRMATIONS:-12}
      REELSHORT_BSC_NODE_URL: ${REELSHORT_BSC_NODE_URL:-https://bsc-dataseed.binance.org/}
      REELSHORT_BSC_API_KEY: ${REELSHORT_BSC_API_KEY:-}
      REELSHORT_BSC_USDT_CONTRACT: ${REELSHORT_BSC_USDT_CONTRACT:-0x55d398326f99059fF775485246999027B3197955}
      REELSHORT_BSC_CHAIN_ID: ${REELSHORT_BSC_CHAIN_ID:-56}
      REELSHORT_BSC_REQUIRED_CONFIRMATIONS: ${REELSHORT_BSC_REQUIRED_CONFIRMATIONS:-15}
      REELSHORT_BSC_USDT_DECIMALS: ${REELSHORT_BSC_USDT_DECIMALS:-18}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      content-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ../admin-web
    container_name: reelshort-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    # 必须直连后端容器：admin-web/nginx.conf 只代理 /api/，/actuator/health 会命中
    # SPA 兜底并始终返回 200，探 127.0.0.1 会让后端宕机也显示 healthy。
    # 镜像为 nginx:1.27-alpine，自带 busybox wget（无 curl）；非 2xx 时 wget 退出码非 0。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://backend:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
